<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#4338ca"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)"/>

  <!-- Subtle grid pattern -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="32"/>
  <circle cx="256" cy="256" r="220" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="16"/>

  <!-- Icon Graphic (Cashier / Barcode / Shopping) -->
  <g filter="url(#shadow)">
    <!-- Shopping Bag Body -->
    <rect x="136" y="180" width="240" height="230" rx="36" fill="#ffffff"/>
    
    <!-- Bag Handle -->
    <path d="M196 180 V 136 C 196 102.8 222.8 76 256 76 C 289.2 76 316 102.8 316 136 V 180" fill="none" stroke="#ffffff" stroke-width="24" stroke-linecap="round"/>

    <!-- Barcode Stripes on Bag -->
    <rect x="176" y="230" width="12" height="90" rx="6" fill="#4f46e5"/>
    <rect x="200" y="230" width="20" height="90" rx="6" fill="#4f46e5"/>
    <rect x="232" y="230" width="8" height="90" rx="4" fill="#4f46e5"/>
    <rect x="252" y="230" width="16" height="90" rx="6" fill="#4f46e5"/>
    <rect x="280" y="230" width="12" height="90" rx="6" fill="#4f46e5"/>
    <rect x="304" y="230" width="22" height="90" rx="6" fill="#4f46e5"/>

    <!-- Laser Line Scan across barcode -->
    <line x1="156" y1="275" x2="356" y2="275" stroke="#f43f5e" stroke-width="8" stroke-linecap="round"/>

    <!-- Sy Logo Star / Sparkle -->
    <circle cx="340" cy="210" r="18" fill="#fbbf24"/>
  </g>

  <!-- Arabic Typography Badge -->
  <rect x="156" y="360" width="200" height="36" rx="18" fill="url(#accent-grad)"/>
  <text x="256" y="384" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="900" fill="#ffffff" text-anchor="middle">المنزل السوري POS</text>
</svg>
